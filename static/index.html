<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b3b6f" />
<title>Oficina · Gestão</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230b3b6f'/><text x='16' y='22' font-size='16' font-family='sans-serif' font-weight='bold' fill='white' text-anchor='middle'>OF</text></svg>" />
<link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="marca"><span class="logo">OF</span><div><strong>Oficina</strong><small>Gestão de serviço</small></div></div>
    <nav class="nav-lateral">
      <button data-vista="inicio"><span class="ic">◎</span>Início</button>
      <button data-vista="ordens"><span class="ic">🔧</span>Obras</button>
      <button data-vista="veiculos"><span class="ic">🚗</span>Viaturas</button>
      <button data-vista="mecanicos"><span class="ic">👷</span>Mecânicos</button>
      <button data-vista="clientes"><span class="ic">👤</span>Clientes</button>
    </nav>
    <button class="primario grande" data-acao="entrada">+ Entrada de viatura</button>
  </aside>

  <div class="painel">
    <header class="topbar">
      <button id="btn-voltar" class="icone hidden" title="Voltar">‹</button>
      <div class="titulos"><h1 id="titulo">Início</h1><p id="subtitulo"></p></div>
      <button id="btn-atualizar" class="icone" title="Atualizar">⟳</button>
    </header>
    <main id="conteudo"></main>
  </div>
</div>

<nav class="tabbar">
  <button data-vista="inicio"><span>◎</span>Início</button>
  <button data-vista="ordens"><span>🔧</span>Obras</button>
  <button class="destaque" data-acao="entrada"><span>＋</span>Entrada</button>
  <button data-vista="veiculos"><span>🚗</span>Viaturas</button>
  <button data-vista="mecanicos"><span>👷</span>Mecânicos</button>
</nav>

<div id="toasts" class="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
