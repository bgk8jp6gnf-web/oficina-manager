name: keepalive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "psycopg[binary]==3.2.3"
      - run: python scripts/keepalive.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
